<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta
			name="viewport"
			content="width=device-width, user-scalable=no, initial-scale=1.0, viewport-fit=cover"
		>
		<meta name="theme-color" content="#033747">
		<title>Project Glasswater</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

html, body {
	width: 100%;
	height: 100%;
}

body {
	color: white;
	background:
		radial-gradient(circle at 50% 30%, #07586b 0%, #033747 44%, #011923 100%);
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	appearance: none;
	bottom: 10%;
	width: min(50%, 28rem);
	height: 0.35rem;
	margin: 0 auto;
	border: 0;
	border-radius: 1rem;
	overflow: hidden;
}

#status-progress::-webkit-progress-bar {
	background: rgba(2, 22, 30, 0.8);
}

#status-progress::-webkit-progress-value {
	background: linear-gradient(90deg, #1ec9cc, #7cf4df);
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: system-ui, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}

#rotate-overlay {
	display: none;
	position: fixed;
	inset: 0;
	z-index: 20;
	box-sizing: border-box;
	padding: max(2rem, env(safe-area-inset-top))
		max(2rem, env(safe-area-inset-right))
		max(2rem, env(safe-area-inset-bottom))
		max(2rem, env(safe-area-inset-left));
	background:
		radial-gradient(circle at 50% 35%, rgba(15, 126, 145, 0.62), transparent 42%),
		linear-gradient(160deg, #032f3e, #01151f 72%);
	font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
	text-align: center;
	align-items: center;
	justify-content: center;
	flex-direction: column;
	gap: 1.1rem;
}

.rotate-phone {
	width: 4.2rem;
	height: 7.2rem;
	border: 0.22rem solid #9ff9ee;
	border-radius: 0.8rem;
	box-shadow: 0 0 2rem rgba(38, 222, 217, 0.38);
	transform: rotate(-8deg);
	animation: rotate-phone 2.6s ease-in-out infinite;
}

#rotate-overlay h1 {
	margin: 0.7rem 0 0;
	font-size: clamp(1.55rem, 7vw, 2.5rem);
	font-weight: 650;
	letter-spacing: 0.04em;
}

#rotate-overlay p {
	max-width: 24rem;
	margin: 0;
	color: #9bdbe0;
	font-size: clamp(0.95rem, 4vw, 1.2rem);
	line-height: 1.5;
}

.rotate-bubbles {
	color: #6be1e7;
	letter-spacing: 0.55rem;
	opacity: 0.7;
}

.portrait-continue {
	margin-top: 0.3rem;
	padding: 0.72rem 1.2rem;
	border: 1px solid rgba(139, 246, 236, 0.68);
	border-radius: 999px;
	color: #d9fffa;
	background: rgba(1, 25, 35, 0.72);
	font: 650 0.88rem/1 system-ui, sans-serif;
	letter-spacing: 0.06em;
	text-transform: uppercase;
}

.portrait-continue:focus-visible {
	outline: 0.16rem solid #7cf4df;
	outline-offset: 0.18rem;
}

@keyframes rotate-phone {
	0%, 20% { transform: rotate(-8deg); }
	55%, 85% { transform: rotate(82deg); }
	100% { transform: rotate(-8deg); }
}

@media (orientation: portrait) and (max-width: 900px) and (hover: none) and (pointer: coarse) {
	#rotate-overlay {
		display: flex;
	}
}

body.portrait-override #rotate-overlay {
	display: none;
}

@media (prefers-reduced-motion: reduce) {
	.rotate-phone {
		animation: none;
		transform: rotate(82deg);
	}
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<div id="rotate-overlay" role="status" aria-label="Rotate device">
			<div class="rotate-phone" aria-hidden="true"></div>
			<h1>TURN TOWARD THE REEF</h1>
			<p>Rotate your phone to landscape for the full living-aquarium experience.</p>
			<button class="portrait-continue" id="portrait-continue" type="button">
				Play anyway
			</button>
			<div class="rotate-bubbles" aria-hidden="true">● · ● · ●</div>
		</div>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="index.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":27231664,"index.wasm":37700666},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	document.getElementById('portrait-continue').addEventListener('click', function () {
		document.body.classList.add('portrait-override');
		document.getElementById('canvas').focus();
	});

	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (
			GODOT_CONFIG['serviceWorker']
			&& GODOT_CONFIG['ensureCrossOriginIsolationHeaders']
			&& 'serviceWorker' in navigator
		) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(
					new Error('Service worker registration failed.')
				);
			}
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			const missingMsg =
				'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
